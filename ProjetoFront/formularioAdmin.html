<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width">
		<link rel="stylesheet" href="/ProjetoFront/style/style.css">
        <title>Admin Page</title>
    </head>

    <body>
    
	<div class="limiter">
		<div class="container-login100">
			<div class="wrap-login100">
				<div class="login100-form-title" style="background-image: url(/ProjetoFront/foto/carlos-muza-hpjSkU2UYSU-unsplash.jpg);">
					<span class="login100-form-title-1">
						Página de Administração
					</span>
				</div>

				<form class="login100-form validate-form" id="form-adm">
					<div class="wrap-input100 validate-input m-b-26" data-validate="Username is required">
						<span class="label-input100">Username</span>
						<input class="input100" type="text" id="usernameAdm" name="usernameAdm" placeholder="Enter username">
						<span class="focus-input100"></span>
					</div>

					<div class="wrap-input100 validate-input m-b-18" data-validate = "Password is required">
						<span class="label-input100">Password</span>
						<input class="input100" id="passwordAdm"  type="password" name="passwordAdm" placeholder="Enter password">
						<span class="focus-input100"></span>
					</div>
					<br>
					<br>
					<div class="container-login100-form-btn">
						<button type="submit" class="login100-form-btn">
							Login
						</button>
					</div>
				</form>
			</div>
		</div>
	</div>

	<script src="index.js"></script>
    </body>
</html>
